name: source-test
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg curl jq >/dev/null
          echo installed
      - name: Test sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          T=/tmp/t; mkdir -p $T
          RES=$T/res.md
          echo '| src | speed | time | frames | maxlag | err | recon | err1 |' > $RES
          echo '|---|---|---|---|---|---|---|---|' >> $RES
          t_one(){
            n="$1"; u="$2"; shift 2; L=$T/$n.log
            if [ -z "$u" ] || [ "$u" = "null" ]; then echo "| $n | NOURL | - | - | - | - | - | - |" >> $RES; return; fi
            timeout 85 ffmpeg -nostdin -loglevel info -stats -stats_period 10 -re -reconnect 1 -reconnect_streamed 1 -reconnect_at_eof 1 -reconnect_delay_max 5 -rw_timeout 30000000 -i "$u" "$@" -f null - >"$L" 2>&1
            sp=$(grep -oE 'speed= *[0-9.]+x' "$L" | tail -1 | tr -d ' ')
            tm=$(grep -oE 'time=[0-9:.]+' "$L" | tail -1)
            fr=$(grep -oE 'frame= *[0-9]+' "$L" | tail -1 | tr -d ' ')
            lag=$(grep -oE 'lag of [0-9.]+s' "$L" | grep -oE '[0-9.]+' | sort -rn | head -1)
            err=$(grep -ciE 'error|invalid|failed|refused|denied|timed out|404|403' "$L")
            rec=$(grep -ci 'econnect' "$L")
            e1=$(grep -iE 'error|invalid|failed|refused|denied|timed out|404|403' "$L" | head -1 | sed 's/^[^ ]* //' | cut -c1-70 | tr '|' '/')
            echo "| $n | ${sp:--} | ${tm:--} | ${fr:--} | ${lag:-0} | $err | $rec | $e1 |" >> $RES
          }
          AL=$(curl -fsS https://aloula.faulio.com/api/v1.1/channels/7/player | jq -r .streams.hls)
          echo "aloula len ${#AL}: $AL" | cut -c1-160
          t_one v_p0_source "$AL" -map 0:p:0 &
          t_one v_p1 "$AL" -map 0:p:1 &
          t_one v_p2 "$AL" -map 0:p:2 &
          t_one v_netsa "http://m.live.net.sa:1935/live/quran/gmswf.m3u8" -map 0:v:0? -map 0:a:0? &
          t_one v_iptv1 "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-hadath/2ff87ec4c2f3ede35295a20637d9f8fd/index.m3u8" -map 0:v:0? -map 0:a:0? &
          t_one v_iptv3 "https://shd-amg-fast.edgenextcdn.net/tx029/playlist.m3u8" -map 0:v:0? -map 0:a:0? &
          t_one r_n12 "http://n12.radiojar.com/8s5u5tpdtwzuv" -map 0:a:0? &
          wait
          cat $RES
          gh issue create --repo ${{ github.repository }} --title "source-test results 2" --body-file $RES
