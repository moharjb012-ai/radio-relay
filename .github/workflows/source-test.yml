name: source-test
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg curl jq >/dev/null
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o yt-dlp && chmod +x yt-dlp
          echo installed
      - name: Test sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          T=/tmp/t; mkdir -p $T
          RES=$T/res.md
          echo "| src | speed | time | frames | maxlag | err | recon |" > $RES
          echo "|---|---|---|---|---|---|---|" >> $RES
          t_one(){
            n="$1"; u="$2"; L=$T/$n.log
            if [ -z "$u" ] || [ "$u" = "null" ]; then echo "| $n | NOURL | - | - | - | - | - |" >> $RES; return; fi
            timeout 85 ffmpeg -nostdin -loglevel info -stats -stats_period 10 -re -reconnect 1 -reconnect_streamed 1 -reconnect_at_eof 1 -reconnect_delay_max 5 -rw_timeout 30000000 -i "$u" -map 0:v:0? -map 0:a:0? -f null - >"$L" 2>&1
            sp=$(grep -oE 'speed= *[0-9.]+x' "$L" | tail -1 | tr -d ' ')
            tm=$(grep -oE 'time=[0-9:.]+' "$L" | tail -1)
            fr=$(grep -oE 'frame= *[0-9]+' "$L" | tail -1 | tr -d ' ')
            lag=$(grep -oE 'lag of [0-9.]+s' "$L" | grep -oE '[0-9.]+' | sort -rn | head -1)
            err=$(grep -ciE 'error|invalid|failed|refused|denied|timed out|404|403' "$L")
            rec=$(grep -ci 'econnect' "$L")
            echo "| $n | ${sp:--} | ${tm:--} | ${fr:--} | ${lag:-0} | $err | $rec |" >> $RES
          }
          # video: aloula current + lowest variant
          AL=$(curl -fsS https://aloula.faulio.com/api/v1.1/channels/7/player | jq -r .streams.hls)
          echo "aloula len ${#AL}"
          if [ -n "$AL" ] && [ "$AL" != "null" ]; then
            curl -fsS "$AL" -o $T/m.m3u8 && head -20 $T/m.m3u8
            BASE=$(echo "$AL" | sed 's#[^/]*$##')
            LOW=$(grep -E '^[^#]' $T/m.m3u8 | tail -1)
            case "$LOW" in http*) LOWU="$LOW";; "") LOWU="";; *) LOWU="$BASE$LOW";; esac
          fi
          # iptv-org SA list
          curl -fsSL https://iptv-org.github.io/iptv/countries/sa.m3u -o $T/sa.m3u
          grep -iB1 -E 'quran|makkah|mecca|haram' $T/sa.m3u | grep -oE 'https?://[^ ]+' | grep m3u8 | head -3 > $T/iptv.txt
          cat $T/iptv.txt
          # youtube
          YU=$(./yt-dlp --no-warnings -g -f 'best[height<=480]/best' 'https://www.youtube.com/@SaudiQuranTV/live' 2>$T/yt.err | head -1)
          echo "yt len ${#YU} err: $(head -c 150 $T/yt.err)"
          # radio extra mirrors from islamic-radio-api list
          curl -fsSL https://raw.githubusercontent.com/uthumany/islamic-radio-api/refs/heads/main/extracted_stations.md -o $T/st.md
          grep -iE -A8 'cairo|القاهرة' $T/st.md | grep -oE 'https?://[^ )"]+' | grep -viE 'radiojar|github|72fm|dubbeh' | head -2 > $T/rm.txt
          cat $T/rm.txt
          # run all tests in parallel
          t_one v_aloula "$AL" &
          t_one v_aloula_low "$LOWU" &
          i=0; while read -r u; do i=$((i+1)); t_one v_iptv$i "$u" & done < $T/iptv.txt
          t_one v_youtube "$YU" &
          t_one r_n12 "http://n12.radiojar.com/8s5u5tpdtwzuv" &
          t_one r_stream "https://stream.radiojar.com/8s5u5tpdtwzuv" &
          t_one r_n0e "http://n0e.radiojar.com/8s5u5tpdtwzuv" &
          i=0; while read -r u; do i=$((i+1)); t_one r_extra$i "$u" & done < $T/rm.txt
          wait
          cat $RES
          gh issue create --repo ${{ github.repository }} --title "source-test results" --body-file $RES
