name: video
on:
  workflow_dispatch:
concurrency:
  group: video
  cancel-in-progress: false
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download video
        run: |
          curl -fsSL -o v.mp4 "https://drive.usercontent.google.com/download?id=1yEWcKFxwNe29Q9ppRebOrHA46egPYwv6&export=download&confirm=t"
          ls -l v.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 v.mp4
      - name: Stream once
        env:
          SRV: ${{ secrets.RTMP_SERVER }}
          KEY: ${{ secrets.RTMP_KEY }}
        run: |
          S="${SRV%/}"
          ffmpeg -nostdin -loglevel info -stats -stats_period 15 -re -i v.mp4 \
            -vf scale=640:360 -c:v libx264 -preset veryfast -b:v 500k -maxrate 600k -bufsize 1200k -g 60 -pix_fmt yuv420p \
            -c:a aac -b:a 64k -ar 44100 -ac 2 -flvflags no_duration_filesize -f flv "$S/$KEY" 2>&1 | sed 's#rtmps\?://[^ ]*#RTMP#g'
          echo "stream finished"
