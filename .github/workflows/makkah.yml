name: makkah
on:
  schedule:
    - cron: '10,30,50 * * * *'
  workflow_dispatch:
    inputs:
      start_at:
        description: 'epoch seconds when this run takes over the stream (empty = watchdog start)'
        required: false
        default: ''
permissions:
  actions: write
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          START_AT: ${{ inputs.start_at }}
        run: |
          if [ -z "$START_AT" ]; then
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow makkah.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
            q=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow makkah.yml --status queued --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
            echo "other in_progress=$n queued=$q"
            if [ "${n:-1}" -gt 0 ] || [ "${q:-1}" -gt 0 ]; then echo "run=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "run=yes" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        if: steps.guard.outputs.run == 'yes'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Stream
        if: steps.guard.outputs.run == 'yes'
        env:
          RTMP: ${{ secrets.RTMP_URL_MAKKAH }}
          GH_TOKEN: ${{ github.token }}
          START_AT: ${{ inputs.start_at }}
        run: |
          now=$(date +%s)
          start=${START_AT:-$now}
          while [ "$(date +%s)" -lt "$start" ]; do sleep 1; done
          END=$((start+14400))
          rm -f /tmp/handoff_sent
          (
            d=$((END-600-$(date +%s)))
            [ "$d" -gt 0 ] && sleep "$d"
            if gh workflow run makkah.yml --repo "$GITHUB_REPOSITORY" -f start_at="$END"; then touch /tmp/handoff_sent; echo "handoff dispatched start_at=$END"; fi
          ) &
          while [ "$(date +%s)" -lt "$END" ]; do
            U=$(curl -fsS https://aloula.faulio.com/api/v1.1/channels/7/player | jq -r .streams.hls | sed 's#playlist_dvr.m3u8#playlist.m3u8#') || U=""
            echo "url ok: ${#U}"
            if [ -n "$U" ] && [ "$U" != "null" ]; then
              timeout $((END-$(date +%s))) ffmpeg -nostdin -loglevel info -stats -stats_period 15 -re -live_start_index -3 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000 -fflags +genpts+discardcorrupt -i "$U" -map 0:p:1 \
                -vf scale=640:360,fps=25 -c:v libx264 -preset ultrafast -b:v 500k -maxrate 600k -bufsize 1200k -g 50 -pix_fmt yuv420p \
                -c:a aac -b:a 64k -ar 44100 -ac 2 -flvflags no_duration_filesize -f flv "$RTMP" 2>&1 | sed 's#rtmps\?://[^ ]*#RTMP#g' | tail -n +1 || true
            fi
            echo "ffmpeg exited, retry"
            sleep 2
          done
      - name: Relaunch if no handoff
        if: ${{ !cancelled() && steps.guard.outputs.run == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/handoff_sent ]; then gh workflow run makkah.yml --repo "$GITHUB_REPOSITORY" -f start_at="$(date +%s)"; fi
