name: makkah
on:
  schedule:
    - cron: '30 */4 * * *'
  workflow_dispatch:
permissions:
  actions: write
concurrency:
  group: makkah
  cancel-in-progress: false
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Stream
        env:
          RTMP: ${{ secrets.RTMP_URL_MAKKAH }}
        run: |
          end=$((SECONDS+14400))
          while [ $SECONDS -lt $end ]; do
            U=$(curl -fsS https://aloula.faulio.com/api/v1.1/channels/7/player | jq -r .streams.hls) || U=""
            echo "url ok: ${#U}"
            if [ -n "$U" ] && [ "$U" != "null" ]; then
              S="$U"
              timeout $((end-SECONDS)) ffmpeg -nostdin -loglevel info -stats -stats_period 15 -re -live_start_index -3 -reconnect 1 -reconnect_streamed 1 -reconnect_at_eof 1 -reconnect_delay_max 5 -rw_timeout 30000000 -thread_queue_size 4096 -fflags +genpts+discardcorrupt -i "$S" -map 0:v:0 -map 0:a:0 \
                -vf scale=640:360,fps=25 -c:v libx264 -preset ultrafast -tune zerolatency -bf 0 -b:v 450k -maxrate 500k -bufsize 500k -g 50 -keyint_min 50 -sc_threshold 0 -pix_fmt yuv420p \
                -af aresample=async=1000:first_pts=0 -c:a aac -b:a 64k -ar 44100 -ac 2 -flvflags no_duration_filesize -f flv "$RTMP" 2>&1 | sed 's#rtmps\?://[^ ]*#RTMP#g' | tail -n +1 || true
            fi
            echo "ffmpeg exited, retry"
            sleep 2
          done
      - name: Relaunch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run makkah.yml --repo ${{ github.repository }}
