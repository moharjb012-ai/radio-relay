name: ytest
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup helper
        run: |
          pip install -q -U yt-dlp bgutil-ytdlp-pot-provider 2>&1 | tail -2
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bg
          cd bg/server && npm ci --silent 2>&1 | tail -2 && npx tsc 2>&1 | tail -3
          (node build/main.js > ../../bg.log 2>&1 &)
          sleep 5
          curl -s http://127.0.0.1:4416/ping || true
      - name: Try youtube
        run: |
          for v in dQw4w9WgXcQ W6XyXQJQVTU DwSJyWAdAJQ; do
            echo "== $v"
            yt-dlp --no-warnings -f "bv*[height<=480]+ba/b[height<=480]" --print "%(id)s %(format_id)s %(height)s %(availability)s" -s "https://www.youtube.com/watch?v=$v" 2>&1 | tail -2 | cut -c1-200
          done
          echo "== playlist"
          yt-dlp --no-warnings --flat-playlist --playlist-items 19-20 --print "%(playlist_index)s %(id)s %(availability)s" "https://youtube.com/playlist?list=PLgaTRTylCbZDo3NyLb7i_NYIyhIKp-Kcq" 2>&1 | tail -3 | cut -c1-200
          yt-dlp --no-warnings -f "bv*[height<=480]+ba/b[height<=480]" --download-sections "*0-10" -o t.mp4 "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>&1 | tail -2 | cut -c1-200
          ls -l t.mp4 || true
