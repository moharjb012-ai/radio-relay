name: ytest
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup helper
        run: |
          pip install -q -U yt-dlp bgutil-ytdlp-pot-provider 2>&1 | tail -2
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bg
          cd bg/server && npm ci --silent 2>&1 | tail -2 && npx tsc 2>&1 | tail -3
          (node build/main.js > ../../bg.log 2>&1 &)
          sleep 5
          curl -s http://127.0.0.1:4416/ping || true
      - name: Try youtube
        run: |
          for c in tv web_safari mweb ios web_embedded tv_simply "tv,web_safari,mweb" default; do
            echo "== client $c"
            yt-dlp --no-warnings --extractor-args "youtube:player_client=$c" -f "bv*[height<=480]+ba/b[height<=480]" --print "%(id)s %(format_id)s %(height)s" -s "https://www.youtube.com/watch?v=W6XyXQJQVTU" 2>&1 | tail -1 | cut -c1-160
          done
