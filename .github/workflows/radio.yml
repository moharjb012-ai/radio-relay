name: radio
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      start_at:
        description: 'epoch seconds when this run takes over the stream (empty = watchdog start)'
        required: false
        default: ''
      mode:
        description: 'audio = audio-only push, video = black 1fps frame + audio'
        required: false
        default: 'video'
permissions:
  actions: write
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          START_AT: ${{ inputs.start_at }}
        run: |
          if [ -z "$START_AT" ]; then
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow radio.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
            q=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow radio.yml --status queued --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
            echo "other in_progress=$n queued=$q"
            if [ "${n:-1}" -gt 0 ] || [ "${q:-1}" -gt 0 ]; then echo "run=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "run=yes" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        if: steps.guard.outputs.run == 'yes'
        run: |
          ok=0
          for i in 1 2 3; do
            if timeout 150 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends ffmpeg; then ok=1; break; fi
            sudo apt-get update -qq || true
          done
          command -v ffmpeg >/dev/null && ok=1
          [ "$ok" = 1 ] || exit 1
      - name: Stream
        if: steps.guard.outputs.run == 'yes'
        env:
          RTMP: ${{ secrets.RTMP_URL }}
          GH_TOKEN: ${{ github.token }}
          START_AT: ${{ inputs.start_at }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          now=$(date +%s)
          start=${START_AT:-$now}
          while [ "$(date +%s)" -lt "$start" ]; do sleep 1; done
          END=$((start+14400))
          rm -f /tmp/handoff_sent
          (
            d=$((END-600-$(date +%s)))
            [ "$d" -gt 0 ] && sleep "$d"
            if gh workflow run radio.yml --repo "$GITHUB_REPOSITORY" -f start_at="$END" -f mode="$(cat /tmp/mode 2>/dev/null || echo video)"; then touch /tmp/handoff_sent; echo "handoff dispatched start_at=$END"; fi
          ) &
          COMMON=(-nostdin -stats -stats_period 30 -loglevel info)
          SRC=(-reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 -i "http://n12.radiojar.com/8s5u5tpdtwzuv")
          AF="volume=10dB,alimiter=limit=0.9"
          AUDIO=("${COMMON[@]}" "${SRC[@]}" -vn -af "$AF" -c:a aac -b:a 64k -ar 44100 -ac 2)
          VIDEO=("${COMMON[@]}" -re -f lavfi -i color=c=0x0b3d2e:s=640x360:r=5 "${SRC[@]}" -map 0:v -map 1:a -c:v libx264 -preset ultrafast -tune stillimage -crf 35 -maxrate 50k -bufsize 100k -pix_fmt yuv420p -g 10 -af "$AF" -c:a aac -b:a 64k -ar 44100 -ac 2)
          MODE=${MODE_IN:-video}
          FAIL=0
          DEAD_SINCE=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ "$MODE" = audio ] && [ "$FAIL" -ge 2 ]; then MODE=video; echo "FALLBACK: audio-only failed twice, switching to black-frame video"; fi
            echo "$MODE" > /tmp/mode
            if [ "$MODE" = audio ]; then FFARGS=("${AUDIO[@]}"); else FFARGS=("${VIDEO[@]}"); fi
            echo "mode=$MODE"
            T0=$(date +%s)
            rm -f /tmp/prog.txt
            (
              timeout $((END-$(date +%s))) ffmpeg "${FFARGS[@]}" -progress /tmp/prog.txt -f flv "$RTMP" 2>&1 | sed 's#rtmps\?://[^ ]*#RTMP#g'
            ) &
            FP=$!
            prev=""
            stall=0
            while kill -0 $FP 2>/dev/null; do
              sleep 5
              cur=$(grep -E '^out_time_us=' /tmp/prog.txt 2>/dev/null | tail -1) || true
              if [ "$cur" = "$prev" ] && [ $(( $(date +%s) - T0 )) -gt 45 ]; then stall=$((stall+5)); else stall=0; fi
              prev="$cur"
              if [ "$stall" -ge 30 ]; then echo "health: ffmpeg stalled 30s, restarting it"; pkill -x ffmpeg || true; stall=0; fi
            done
            wait $FP || true
            RUN=$(( $(date +%s) - T0 ))
            if [ "$RUN" -lt 20 ]; then
              FAIL=$((FAIL+1))
              [ "$DEAD_SINCE" -eq 0 ] && DEAD_SINCE=$(date +%s)
            else
              FAIL=0
              DEAD_SINCE=0
            fi
            echo "ffmpeg exited after ${RUN}s (fail streak $FAIL), retry"
            if [ "$DEAD_SINCE" -ne 0 ] && [ $(( $(date +%s) - DEAD_SINCE )) -gt 900 ]; then
              echo "ALERT: no output for 15 min, failing this run so GitHub notifies"
              exit 1
            fi
            sleep 2
          done
      - name: Relaunch if no handoff
        if: ${{ !cancelled() && steps.guard.outputs.run == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/handoff_sent ]; then gh workflow run radio.yml --repo "$GITHUB_REPOSITORY" -f start_at="$(date +%s)" -f mode="$(cat /tmp/mode 2>/dev/null || echo video)"; fi
